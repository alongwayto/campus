server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_device?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: campus-device-management-secret-key-2024-very-long-and-secure
  expiration: 86400000

backup:
  dir: ./backups/

ai:
  model:
    path: ./models/
    fault-diagnosis: fault_diagnosis_model.json
    anomaly-detection: anomaly_detection_model.json
  prediction:
    threshold: 0.7
    window-days: 30

websocket:
  allowed-origins: "*"

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.campus.device: DEBUG
    org.springframework.web: INFO
